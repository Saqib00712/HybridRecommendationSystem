services:
  - type: web
    name: smartreco-ai
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MESH_API_KEY
        sync: false
      - key: LANGCHAIN_API_KEY
        sync: false
      - key: SECRET_KEY
        value: smartreco-production-key