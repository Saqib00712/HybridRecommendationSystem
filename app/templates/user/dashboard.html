{% extends "base.html" %}
{% block title %}User Dashboard{% endblock %}
{% block content %}
<div id="dashboardContent">
    <div class="text-center mt-5">
        <div class="spinner-border"></div>
        <p>Loading your dashboard...</p>
    </div>
</div>

<script>
async function loadDashboard() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    
    if (!token || !user) {
        window.location.href = '/login';
        return;
    }
    
    try {
        const recResponse = await fetch('/api/recommendations/latest', {
            headers: {'Authorization': 'Bearer ' + token}
        });
        const recData = await recResponse.json();
        
        const behResponse = await fetch('/api/behaviors/my?limit=10', {
            headers: {'Authorization': 'Bearer ' + token}
        });
        const behaviors = await behResponse.json();
        
        let html = '<h2>👋 Welcome, ' + (user.full_name || user.username) + '!</h2>';
        
        // Latest Recommendation
        if (recData.recommendation) {
            const recTime = new Date(recData.recommendation.timestamp);
            const timeAgo = getTimeAgo(recTime);
            
            html += '<div class="card my-4 border-success">';
            html += '<div class="card-header bg-success text-white d-flex justify-content-between">';
            html += '<h4 class="mb-0">⭐ Your Recommendations</h4>';
            html += '<small>🕐 ' + timeAgo + '</small>';
            html += '</div><div class="card-body">';
            html += '<p class="lead">' + recData.recommendation.generated_message + '</p>';
            html += '<small class="text-muted">Generated: ' + recTime.toLocaleString() + '</small>';
            
            if (recData.products && recData.products.length > 0) {
                html += '<hr><h5>Courses for you:</h5><div class="row">';
                recData.products.forEach(p => {
                    html += '<div class="col-md-4 mb-3"><div class="card h-100"><div class="card-body">';
                    html += '<h6>' + p.title + '</h6>';
                    html += '<span class="badge bg-primary">' + p.category + '</span> ';
                    html += '<span class="badge bg-secondary">' + p.difficulty + '</span>';
                    html += '<p class="mt-2 small">' + p.description.substring(0, 80) + '...</p>';
                    html += '<small>👨‍🏫 ' + p.instructor + ' | $' + p.price + '</small>';
                    html += '</div></div></div>';
                });
                html += '</div>';
            }
            html += '</div></div>';
        } else {
            html += '<div class="alert alert-info">';
            html += '<h5>🔮 How to get recommendations:</h5>';
            html += '<p>Go to <a href="/products">Products</a> and click <strong>"View & Get Recommendations"</strong> on courses you like.</p>';
            html += '<p>After viewing 3+ products, AI will recommend similar courses!</p>';
            html += '</div>';
        }
        
        // Activity History
        html += '<div class="card"><div class="card-header bg-info text-white">';
        html += '<h5 class="mb-0">📊 Your Activity</h5></div><div class="card-body">';
        
        if (behaviors.length > 0) {
            html += '<ul class="list-group">';
            behaviors.forEach(b => {
                let icon = b.event_type === 'product_view' ? '👁️' : '🔍';
                let detail = b.product_id ? 'Viewed Product #' + b.product_id : 'Searched: ' + b.search_query;
                let time = new Date(b.timestamp);
                html += '<li class="list-group-item d-flex justify-content-between">';
                html += '<span>' + icon + ' ' + detail + '</span>';
                html += '<small class="text-muted">' + time.toLocaleString() + '</small>';
                html += '</li>';
            });
            html += '</ul>';
        } else {
            html += '<p class="text-muted">No activity yet.</p>';
        }
        html += '</div></div>';
        
        document.getElementById('dashboardContent').innerHTML = html;
        
    } catch (error) {
        document.getElementById('dashboardContent').innerHTML = 
            '<div class="alert alert-danger">Session expired. <a href="/login">Login again</a></div>';
    }
}

function getTimeAgo(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 60) return 'Just now';
    if (seconds < 3600) return Math.floor(seconds / 60) + ' mins ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
    return Math.floor(seconds / 86400) + ' days ago';
}

loadDashboard();
</script>
{% endblock %}
