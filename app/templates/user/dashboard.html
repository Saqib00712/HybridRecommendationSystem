{% extends "base.html" %}
{% block title %}User Dashboard{% endblock %}
{% block content %}
<div id="dashboardContent">
    <div class="text-center mt-5">
        <div class="spinner-border"></div>
        <p>Loading your dashboard...</p>
    </div>
</div>

<script>
async function loadDashboard() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    
    if (!token || !user) {
        window.location.href = '/login';
        return;
    }
    
    try {
        // Get latest recommendation
        const recResponse = await fetch('/api/recommendations/latest', {
            headers: {'Authorization': 'Bearer ' + token}
        });
        const recData = await recResponse.json();
        
        // Get recent behaviors
        const behResponse = await fetch('/api/behaviors/my?limit=10', {
            headers: {'Authorization': 'Bearer ' + token}
        });
        const behaviors = await behResponse.json();
        
        let html = '<h2>👋 Welcome, ' + (user.full_name || user.username) + '!</h2>';
        
        // Latest Recommendation with timestamp
        if (recData.recommendation && recData.products && recData.products.length > 0) {
            const recTime = new Date(recData.recommendation.timestamp);
            const timeAgo = getTimeAgo(recTime);
            
            html += '<div class="card my-4 border-success shadow">';
            html += '<div class="card-header bg-success text-white d-flex justify-content-between align-items-center">';
            html += '<h4 class="mb-0">⭐ Your Recommendations</h4>';
            html += '<small>🕐 ' + timeAgo + '</small>';
            html += '</div>';
            html += '<div class="card-body">';
            html += '<p class="lead">' + recData.recommendation.generated_message + '</p>';
            html += '<small class="text-muted">Generated: ' + recTime.toLocaleString() + '</small>';
            
            html += '<hr><h5>📚 Courses For You:</h5><div class="row">';
            
            recData.products.forEach(p => {
                html += '<div class="col-md-4 mb-3">';
                html += '<div class="card h-100 shadow-sm">';
                html += '<div class="card-body">';
                html += '<h6 class="card-title">' + p.title + '</h6>';
                html += '<span class="badge bg-primary">' + (p.category || 'General') + '</span> ';
                html += '<span class="badge bg-secondary">' + (p.difficulty || 'All Levels') + '</span>';
                html += '<p class="mt-2 small text-muted">' + (p.description || '').substring(0, 80) + '...</p>';
                html += '<div class="d-flex justify-content-between align-items-center">';
                html += '<small>👨‍🏫 ' + (p.instructor || 'Expert Instructor') + '</small>';
                html += '<strong>$' + (p.price || '0.00') + '</strong>';
                html += '</div>';
                html += '<small class="text-muted">⏱ ' + (p.duration || 'Self-paced') + '</small>';
                html += '</div></div></div>';
            });
            
            html += '</div>';
            html += '</div></div>';
        } else {
            html += '<div class="alert alert-info mt-4">';
            html += '<h5>🔮 No recommendations yet!</h5>';
            html += '<p>Go to <a href="/products" class="btn btn-primary btn-sm">Products Page</a> and click <strong>"View & Get Recommendations"</strong> on courses you like.</p>';
            html += '<p class="small">After viewing a few products, AI will automatically generate personalized recommendations!</p>';
            html += '</div>';
        }
        
        // Recent Activity with timestamps
        html += '<div class="card mt-4 shadow">';
        html += '<div class="card-header bg-info text-white">';
        html += '<h5 class="mb-0">📊 Your Recent Activity</h5>';
        html += '</div><div class="card-body">';
        
        if (behaviors.length > 0) {
            html += '<div class="list-group">';
            behaviors.forEach(b => {
                let icon = b.event_type === 'product_view' ? '👁️' : '🔍';
                let detail = b.product_id ? 'Viewed Product #' + b.product_id : (b.search_query ? 'Searched: ' + b.search_query : 'Activity');
                let time = new Date(b.timestamp);
                html += '<div class="list-group-item d-flex justify-content-between align-items-center">';
                html += '<span>' + icon + ' ' + detail + '</span>';
                html += '<small class="text-muted">' + time.toLocaleString() + '</small>';
                html += '</div>';
            });
            html += '</div>';
        } else {
            html += '<p class="text-muted">No activity yet. Start browsing products!</p>';
        }
        
        html += '</div></div>';
        
        // Refresh button
        html += '<div class="text-center mt-3">';
        html += '<button class="btn btn-outline-success" onclick="location.reload()">🔄 Refresh Dashboard</button>';
        html += '</div>';
        
        document.getElementById('dashboardContent').innerHTML = html;
        
    } catch (error) {
        console.error('Error:', error);
        document.getElementById('dashboardContent').innerHTML = 
            '<div class="alert alert-danger">Session expired. <a href="/login">Login again</a></div>';
    }
}

function getTimeAgo(date) {
    const seconds = Math.floor((new Date() - date) / 1000);
    if (seconds < 60) return 'Just now';
    if (seconds < 3600) return Math.floor(seconds / 60) + ' mins ago';
    if (seconds < 86400) return Math.floor(seconds / 3600) + ' hours ago';
    return Math.floor(seconds / 86400) + ' days ago';
}

// Auto-refresh every 30 seconds
setInterval(loadDashboard, 30000);

loadDashboard();
</script>
{% endblock %}
