{% extends "base.html" %}
{% block title %}Manage Products{% endblock %}
{% block content %}
<div id="adminProducts">
    <div class="text-center mt-5">
        <div class="spinner-border"></div>
        <p>Loading product manager...</p>
    </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="productModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
        <div class="modal-content">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title" id="modalTitle">Add Product</h5>
                <button class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <form id="productForm">
                    <input type="hidden" id="productId">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Title *</label>
                            <input type="text" class="form-control" id="title" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Category *</label>
                            <select class="form-select" id="category" required>
                                <option value="">Select...</option>
                                <option>Python</option><option>Artificial Intelligence</option>
                                <option>Machine Learning</option><option>Generative AI</option>
                                <option>Agentic AI</option><option>LangGraph</option>
                                <option>LangChain</option><option>Data Science</option>
                                <option>FastAPI</option><option>Cloud</option>
                                <option>DevOps</option><option>Web Development</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Difficulty *</label>
                            <select class="form-select" id="difficulty" required>
                                <option value="">Select...</option>
                                <option>Beginner</option><option>Intermediate</option><option>Advanced</option>
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Price *</label>
                            <input type="number" step="0.01" class="form-control" id="price" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Instructor *</label>
                            <input type="text" class="form-control" id="instructor" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Duration *</label>
                            <input type="text" class="form-control" id="duration" placeholder="e.g., 8 weeks" required>
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Tags (comma separated)</label>
                            <input type="text" class="form-control" id="tags" placeholder="python,ai,beginner">
                        </div>
                        <div class="col-12 mb-3">
                            <label class="form-label">Description *</label>
                            <textarea class="form-control" id="description" rows="3" required></textarea>
                        </div>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary" onclick="saveProduct()">💾 Save Product</button>
            </div>
        </div>
    </div>
</div>

<script>
const token = localStorage.getItem('token');
const user = JSON.parse(localStorage.getItem('user') || 'null');

if (!token || !user || user.role !== 'admin') {
    window.location.href = '/login';
}

let allProducts = [];

async function loadProducts() {
    const response = await fetch('/api/products/?limit=100', {
        headers: {'Authorization': 'Bearer ' + token}
    });
    const data = await response.json();
    allProducts = data.products;
    
    let html = `
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>📦 Product Management</h2>
            <div>
                <a href="/admin/dashboard" class="btn btn-outline-secondary">← Dashboard</a>
                <button class="btn btn-success" onclick="openAddModal()">➕ Add New Product</button>
            </div>
        </div>
        <div class="card shadow">
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th><th>Title</th><th>Category</th><th>Difficulty</th>
                            <th>Price</th><th>Instructor</th><th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
    `;
    
    allProducts.forEach(p => {
        html += `
            <tr>
                <td>#${p.id}</td>
                <td>${p.title}</td>
                <td><span class="badge bg-primary">${p.category}</span></td>
                <td><span class="badge bg-secondary">${p.difficulty}</span></td>
                <td>$${p.price}</td>
                <td>${p.instructor}</td>
                <td>
                    <button class="btn btn-sm btn-warning" onclick="openEditModal(${p.id})">✏️ Edit</button>
                    <button class="btn btn-sm btn-danger" onclick="deleteProduct(${p.id})">🗑 Delete</button>
                </td>
            </tr>
        `;
    });
    
    html += '</tbody></table></div></div>';
    document.getElementById('adminProducts').innerHTML = html;
}

function openAddModal() {
    document.getElementById('modalTitle').textContent = '➕ Add New Product';
    document.getElementById('productId').value = '';
    document.getElementById('productForm').reset();
    new bootstrap.Modal(document.getElementById('productModal')).show();
}

function openEditModal(id) {
    const product = allProducts.find(p => p.id === id);
    if (!product) return;
    
    document.getElementById('modalTitle').textContent = '✏️ Edit: ' + product.title;
    document.getElementById('productId').value = product.id;
    document.getElementById('title').value = product.title;
    document.getElementById('category').value = product.category;
    document.getElementById('difficulty').value = product.difficulty;
    document.getElementById('price').value = product.price;
    document.getElementById('instructor').value = product.instructor;
    document.getElementById('duration').value = product.duration;
    document.getElementById('tags').value = product.tags;
    document.getElementById('description').value = product.description;
    
    new bootstrap.Modal(document.getElementById('productModal')).show();
}

async function saveProduct() {
    const id = document.getElementById('productId').value;
    const data = {
        title: document.getElementById('title').value,
        category: document.getElementById('category').value,
        difficulty: document.getElementById('difficulty').value,
        price: parseFloat(document.getElementById('price').value),
        instructor: document.getElementById('instructor').value,
        duration: document.getElementById('duration').value,
        tags: document.getElementById('tags').value,
        description: document.getElementById('description').value
    };
    
    const url = id ? `/api/products/${id}` : '/api/products/';
    const method = id ? 'PUT' : 'POST';
    
    try {
        const response = await fetch(url, {
            method: method,
            headers: {
                'Authorization': 'Bearer ' + token,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
        
        if (response.ok) {
            alert('✅ Product saved!');
            bootstrap.Modal.getInstance(document.getElementById('productModal')).hide();
            loadProducts();
        } else {
            const err = await response.json();
            alert('❌ Error: ' + (err.detail || 'Failed'));
        }
    } catch (error) {
        alert('❌ Network error');
    }
}

async function deleteProduct(id) {
    if (!confirm('Delete product #' + id + '? This cannot be undone.')) return;
    
    const response = await fetch('/api/products/' + id, {
        method: 'DELETE',
        headers: {'Authorization': 'Bearer ' + token}
    });
    
    if (response.ok) {
        alert('✅ Deleted!');
        loadProducts();
    } else {
        alert('❌ Delete failed');
    }
}

loadProducts();
</script>
{% endblock %}
