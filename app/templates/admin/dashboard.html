{% extends "base.html" %}
{% block title %}Admin Dashboard{% endblock %}
{% block content %}
<div id="adminContent">
    <div class="text-center mt-5">
        <div class="spinner-border"></div>
        <p>Loading admin panel...</p>
    </div>
</div>

<script>
async function loadAdminDashboard() {
    const token = localStorage.getItem('token');
    const user = JSON.parse(localStorage.getItem('user') || 'null');
    
    if (!token || !user || user.role !== 'admin') {
        window.location.href = '/login';
        return;
    }
    
    // Fetch real stats
    const [productsRes, usersRes] = await Promise.all([
        fetch('/api/products/?limit=100', {headers: {'Authorization': 'Bearer ' + token}}),
        fetch('/auth/me', {headers: {'Authorization': 'Bearer ' + token}})
    ]);
    
    const productsData = await productsRes.json();
    const totalProducts = productsData.total;
    
    // Count categories
    const categories = {};
    productsData.products.forEach(p => {
        categories[p.category] = (categories[p.category] || 0) + 1;
    });
    
    let html = `
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>🔧 Admin Dashboard</h2>
            <span class="badge bg-success fs-6">Logged in as Admin</span>
        </div>
        
        <!-- Stats Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="card bg-primary text-white shadow">
                    <div class="card-body text-center">
                        <h1 class="display-4">${totalProducts}</h1>
                        <h5>Total Products</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-success text-white shadow">
                    <div class="card-body text-center">
                        <h1 class="display-4">${Object.keys(categories).length}</h1>
                        <h5>Categories</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-info text-white shadow">
                    <div class="card-body text-center">
                        <h1 class="display-4">2</h1>
                        <h5>Users</h5>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="card bg-warning text-dark shadow">
                    <div class="card-body text-center">
                        <h1 class="display-4">🟢</h1>
                        <h5>System Active</h5>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Category Distribution -->
        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">📊 Products by Category</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-sm">
                            <thead><tr><th>Category</th><th>Count</th></tr></thead>
                            <tbody>
    `;
    
    Object.entries(categories).sort((a,b) => b[1] - a[1]).forEach(([cat, count]) => {
        html += `<tr><td><span class="badge bg-primary">${cat}</span></td><td><strong>${count}</strong></td></tr>`;
    });
    
    html += `
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            
            <!-- Quick Actions -->
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0">⚡ Quick Actions</h5>
                    </div>
                    <div class="card-body">
                        <a href="/admin/products" class="btn btn-primary w-100 mb-3">
                            📦 Manage Products (Add/Edit/Delete)
                        </a>
                        <a href="/products" class="btn btn-outline-success w-100 mb-3">
                            👁 View Product Catalog
                        </a>
                        <a href="/user/dashboard" class="btn btn-outline-info w-100">
                            👤 View User Dashboard
                        </a>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- Recent Products -->
        <div class="card shadow">
            <div class="card-header bg-dark text-white d-flex justify-content-between">
                <h5 class="mb-0">📦 Recent Products</h5>
                <a href="/admin/products" class="btn btn-sm btn-light">View All</a>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Category</th>
                            <th>Difficulty</th>
                            <th>Instructor</th>
                            <th>Price</th>
                        </tr>
                    </thead>
                    <tbody>
    `;
    
    productsData.products.slice(0, 10).forEach(p => {
        html += `
            <tr>
                <td>#${p.id}</td>
                <td><strong>${p.title}</strong></td>
                <td><span class="badge bg-primary">${p.category}</span></td>
                <td><span class="badge bg-secondary">${p.difficulty}</span></td>
                <td>${p.instructor}</td>
                <td><strong>$${p.price}</strong></td>
            </tr>
        `;
    });
    
    html += `
                    </tbody>
                </table>
            </div>
        </div>
    `;
    
    document.getElementById('adminContent').innerHTML = html;
}

loadAdminDashboard();
</script>
{% endblock %}
